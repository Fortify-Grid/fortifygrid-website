<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Comstock BESS Viewer</title>
<style>
/* Layout: full-height tool — header bar, object/area/drawing rail left, 3D canvas centre, detail drawer right. */
:root{
  --bg:#eef1f4; --panel:#ffffff; --ink:#1d2430; --mute:#5f6b7a; --line:#dde3ea; --float:rgba(255,255,255,.93);
  --accent:#1f6feb; --accent-ink:#ffffff; --ok:#1a7f37; --warn:#a15c00; --bad:#c62828;
  --note-bg:#fff7e3; --note-line:#efd79c; --tip-bg:#1d2430; --tip-ink:#ffffff; --scrim:rgba(10,14,20,.42);
  --mv:#d7263d; --dc:#f28c28; --lv:#2b6cb0; --com:#2f9e44; --gnd:#b87333;
  --f-ui:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif; --f-mono:ui-monospace,SFMono-Regular,Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#12161c; --panel:#1a1f27; --ink:#e6eaf0; --mute:#9aa5b4; --line:#2c333d; --float:rgba(26,31,39,.93);
  --accent:#4c8dff; --accent-ink:#0b1220; --ok:#4cc26b; --warn:#f0a83a; --bad:#ff6b6b;
  --note-bg:#2a2414; --note-line:#5c4a1c; --tip-bg:#e6eaf0; --tip-ink:#12161c; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#12161c; --panel:#1a1f27; --ink:#e6eaf0; --mute:#9aa5b4; --line:#2c333d; --float:rgba(26,31,39,.93);
  --accent:#4c8dff; --accent-ink:#0b1220; --ok:#4cc26b; --warn:#f0a83a; --bad:#ff6b6b;
  --note-bg:#2a2414; --note-line:#5c4a1c; --tip-bg:#e6eaf0; --tip-ink:#12161c; --scrim:rgba(0,0,0,.6); color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%}
body{background:var(--bg);color:var(--ink);font:13px/1.45 var(--f-ui);display:flex;flex-direction:column;overflow:hidden}
header{flex:none;min-height:52px;display:flex;flex-wrap:wrap;align-items:center;gap:8px 10px;padding-block:8px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));background:var(--panel);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0;white-space:nowrap}
header h1 small{color:var(--mute);font-weight:400;margin-left:6px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:8px;overflow:hidden}
.seg button{border:0;background:transparent;padding:7px 12px;white-space:nowrap;cursor:pointer;color:var(--ink);font:inherit}
.seg button+button{border-left:1px solid var(--line)}
.seg button.on{background:var(--accent);color:var(--accent-ink)}
button:focus-visible,.row:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.spacer{flex:1}
.btn{text-decoration:none;display:inline-block;border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:6px 10px;cursor:pointer;font:inherit;color:var(--ink)}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
#app{flex:1;min-height:0;display:flex;position:relative}
aside{background:var(--panel);overflow:auto}
#left{width:300px;flex:none;border-right:1px solid var(--line);display:flex;flex-direction:column}
#right{width:340px;flex:none;border-left:1px solid var(--line);padding:14px}
.tabs{display:flex;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--panel);z-index:1}
.tabs button{flex:1;border:0;background:none;padding:10px 4px;cursor:pointer;font:inherit;color:var(--mute);border-bottom:2px solid transparent}
.tabs button.on{color:var(--ink);border-bottom-color:var(--accent);font-weight:600}
.pane{padding:12px;display:none}
.pane.on{display:block}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--mute);margin:14px 0 6px}
h3:first-child{margin-top:0}
.row{display:flex;align-items:center;gap:8px;padding:5px 6px;border-radius:6px;cursor:pointer}
.row:hover{background:var(--bg)}
.sw{width:10px;height:10px;border-radius:2px;flex:none}
.chip{font-size:11px;padding:1px 6px;border-radius:10px;border:1px solid currentColor;white-space:nowrap}
.chip.have{color:var(--ok)} .chip.partial{color:var(--warn)} .chip.missing{color:var(--bad)}
table{border-collapse:collapse;width:100%;font-variant-numeric:tabular-nums}
td,th{text-align:left;padding:4px 6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mute);font-weight:600;font-size:12px}
.tw{overflow-x:auto}
#view{flex:1;position:relative;min-width:0;min-height:0;isolation:isolate}
#view canvas{display:block}
#hud{position:absolute;left:10px;bottom:10px;background:var(--float);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:6px 10px;font:12px var(--f-mono);pointer-events:none;max-width:calc(100% - 20px);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#hint{position:absolute;left:50%;top:10px;transform:translateX(-50%);background:var(--tip-bg);color:var(--tip-ink);border-radius:8px;padding:6px 12px;font-size:12px;pointer-events:none;max-width:calc(100% - 20px)}
#hint:empty{display:none}
#legend{position:absolute;right:10px;top:10px;background:var(--float);color:var(--ink);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:12px}
#legend:empty{display:none}
#legend div{display:flex;align-items:center;gap:6px}
.lbl{font:11px var(--f-ui);background:rgba(29,36,48,.82);color:#ffffff;padding:2px 6px;border-radius:4px;white-space:nowrap;pointer-events:none}
.mlbl{font:12px var(--f-mono);background:var(--panel);color:var(--ink);border:1.5px solid var(--accent);padding:3px 7px;border-radius:6px;white-space:nowrap;pointer-events:none}
.kv td:first-child{color:var(--mute);width:42%}
.det h2{font-size:16px;margin:0 0 2px;text-wrap:balance}
.det .sub{color:var(--mute);margin-bottom:10px}
.close{float:right;border:0;background:none;font-size:18px;cursor:pointer;color:var(--mute)}
#modal{position:fixed;inset:0;background:var(--scrim);display:flex;align-items:center;justify-content:center;z-index:20;padding:16px}
#modal .box{background:var(--panel);color:var(--ink);border-radius:12px;width:min(1000px,100%);max-height:100%;display:flex;flex-direction:column;min-width:0}
#modal .hd{display:flex;flex-wrap:wrap;align-items:center;gap:8px;padding:12px 16px;border-bottom:1px solid var(--line)}
#modal .bd{padding:12px 16px;overflow:auto;min-width:0}
#modal pre{white-space:pre-wrap;font:12px/1.5 var(--f-mono)}
.note{background:var(--note-bg);border:1px solid var(--note-line);border-radius:8px;padding:8px 10px;font-size:12px;margin:8px 0}
a{color:var(--accent)}
.req{max-width:78ch;line-height:1.55}
.req h2{font-size:18px;margin:4px 0 4px;text-wrap:balance}
.req h4{font-size:14px;margin:18px 0 6px}
.req p,.req li{font-size:13.5px}
.req .meta{color:var(--mute);font-size:12px}
.set{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 16px;align-items:center;max-width:520px}
.set label{font-weight:600}.set small{display:block;color:var(--mute);font-weight:400}
@media (max-width:1200px){header h1 small{display:none}.seg button{padding:6px 8px}}
@media (max-width:900px){#left{width:240px}#right{position:absolute;right:0;top:0;bottom:0;z-index:5;width:min(340px,100%);box-shadow:0 0 24px var(--scrim)}}
@media (max-width:640px){#app{flex-direction:column}#view{flex:1.3}#left{width:auto;flex:1;border-right:0;border-top:1px solid var(--line)}header h1{font-size:14px}}
</style>

{"imports":{
  "three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",

<header>
  <a id="backApps" class="btn" href="/" hidden>← Apps</a>
  <h1>VV.5 Comstock BESS <small>8 MW / 20 MWh · AEP 12.47 kV</small></h1>
  <div class="seg" id="views">
    <button data-v="spatial" class="on">1 · Spatial</button>
    <button data-v="electrical">2 · Electrical</button>
    <button data-v="civil">3 · Civil / Structural</button>
  </div>
  <div class="seg" id="tools">
    <button data-t="orbit" class="on" title="Rotate / pan / zoom">Navigate</button>
    <button data-t="measure" title="Click two points">Measure</button>
    <button data-t="area" title="Drag a box in plan">Select area</button>
  </div>
  <div class="spacer"></div>
  <div class="seg" id="cams">
    <button data-c="iso">3D</button><button data-c="top">Plan</button><button data-c="front">Elev</button>
  </div>
  <span id="appDl" hidden></span>
  <button class="btn" id="adminBtn" title="Requirements, model basis and settings">Admin</button>
</header>

<div id="app">
  <aside id="left">
    <div class="tabs">
      <button data-p="objects" class="on">Objects</button>
      <button data-p="areas">Areas &amp; BOM</button>
      <button data-p="mdl">Drawings</button>
    </div>

<div id="modal" hidden><div class="box" role="dialog" aria-modal="true" aria-labelledby="mTitle">

  <div class="bd" id="mBody"></div>
</div></div>

<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'three/addons/controls/OrbitControls.js';
import {CSS2DRenderer, CSS2DObject} from 'three/addons/renderers/CSS2DRenderer.js';

/* ============================================================
   UNITS: feet. PLANT GRID: origin = SW fence corner, +x along the
   long fence (bearing N38°17'15"E per plot plan E100), +y across,
   z = elevation above finished grade.  three.js: X=x, Y=z, Z=-y.
   Sources: E-301 (60% equip layout), PNA-IND-FORT-001 sh.03 (GA +
   survey point table), E-200 SLD, E-403 cable schedule, 60% BOM.
   ============================================================ */
const L = (x, y, z = 0) => new THREE.Vector3(x, z, -y);
const PDFS = ['localhost', '127.0.0.1'].includes(location.hostname) || location.protocol === 'file:'; // drive copy: source PDFs sit next to the page
const APP = /(^|\.)fortifygrid\.com$/.test(location.hostname);                                            // ide.fortifygrid.com (portal sign-in)
const LOCAL = PDFS || APP;                                                                                 // direct page: real downloads and print
const PREF = (() => { try { return JSON.parse(localStorage.getItem('cms-viewer-prefs') || '{}'); } catch { return {}; } })();
let UNITS = PREF.units || 'ft';
const FT = v => { if (UNITS === 'm') return `${(v * 0.3048).toFixed(2)} m`; const s = v < 0 ? '-' : ''; v = Math.abs(v); let f = Math.floor(v), i = Math.round((v - f) * 12); if (i === 12) { f++; i = 0; } return `${s}${f}'-${i}"`; };
const r1 = v => Math.round(v * 10) / 10;

// ---- survey control (PNA sheet 03 point table, state plane US ft) ----
const AZ = 38.2875 * Math.PI / 180, S = Math.sin(AZ), C = Math.cos(AZ);
const SV = {
  P6: [13824672.4665, 1289927.9870], P5: [13824689.5560, 1289938.3099], P4: [13824706.6108, 1289948.7618],
  P3: [13824723.6981, 1289959.1453], P2: [13824740.7857, 1289969.5290], P1: [13824757.8733, 1289979.9127],
  T1: [13824675.7877, 1289946.5376], RP: [13824676.1525, 1289941.9415]
};
const ANC = { x: 98.6, y: 50.8, N: SV.P6[0], E: SV.P6[1], lat: 29.745115, lon: -101.138526 }; // P6 located on GA
const toLocal = ([N, E]) => { const dN = N - ANC.N, dE = E - ANC.E; return { x: ANC.x + dE * S + dN * C, y: ANC.y - dE * C + dN * S }; };
const toSP = (x, y) => { const dx = x - ANC.x, dy = y - ANC.y; const dE = dx * S - dy * C, dN = dx * C + dy * S;
  return { N: ANC.N + dN, E: ANC.E + dE, lat: ANC.lat + dN * 0.3048 / 111320, lon: ANC.lon + dE * 0.3048 / (111320 * Math.cos(ANC.lat * Math.PI / 180)) }; };

// ---- scene ----
const view = document.getElementById('view');
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.05;
view.prepend(renderer.domElement);
const lr = new CSS2DRenderer(); lr.domElement.style.cssText = 'position:absolute;top:0;left:0;pointer-events:none';
view.appendChild(lr.domElement);

const scene = new THREE.Scene();
scene.background = new THREE.Color('#dfe7ee');
scene.fog = new THREE.Fog('#dfe7ee', 500, 1100);
const camera = new THREE.PerspectiveCamera(40, 1, 0.5, 3000);
const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true; controls.maxPolarAngle = Math.PI * 0.495;

scene.add(new THREE.HemisphereLight('#ffffff', '#b8a787', 1.1));
const sun = new THREE.DirectionalLight('#fff6e8', 2.2);
sun.position.copy(L(-60, -140, 220)); sun.target.position.copy(L(61, 44, 0));
sun.castShadow = true; sun.shadow.mapSize.set(4096, 4096);
Object.assign(sun.shadow.camera, { left: -170, right: 170, top: 170, bottom: -170, near: 10, far: 700 });
sun.shadow.bias = -0.0004; sun.shadow.normalBias = 0.05;
scene.add(sun, sun.target);

const M = (color, o = {}) => new THREE.MeshStandardMaterial({ color, roughness: 0.75, metalness: 0.05, ...o });
const MAT = {
  white: M('#f3f4f6', { roughness: 0.45 }), seam: M('#9aa3ad'), hvac: M('#c9ced5', { roughness: 0.5 }), blue: M('#1f6feb', { roughness: 0.4 }),
  inv: M('#e9ecef', { roughness: 0.45 }), xfmr: M('#8e98a3', { roughness: 0.5, metalness: 0.25 }), steel: M('#7b838c', { metalness: 0.5, roughness: 0.4 }),
  conc: M('#c8c6c0', { roughness: 0.95 }), concOld: M('#b6b3ab', { roughness: 0.95 }), gravel: M('#bdb9b0', { roughness: 1 }), road: M('#c9bea6', { roughness: 1 }),
  wood: M('#7a5a3a', { roughness: 0.9 }), panel: M('#d9dde2', { roughness: 0.5 }), black: M('#2b2f36'), porcelain: M('#6d4c41'),
  fence: new THREE.MeshStandardMaterial({ color: '#8e979f', transparent: true, opacity: 0.28, side: THREE.DoubleSide, depthWrite: false }),
  mv: M('#d7263d'), dc: M('#f28c28'), lv: M('#2b6cb0'), com: M('#2f9e44'), gnd: M('#b87333', { metalness: 0.6, roughness: 0.35 }),
  ohl: M('#5b6066', { metalness: 0.6 }), trench: M('#8d6e4f', { transparent: true, opacity: 0.55, depthWrite: false })
};
const ground = new THREE.Mesh(new THREE.PlaneGeometry(1400, 1400), M('#d8c8a5', { roughness: 1, transparent: true }));
ground.rotation.x = -Math.PI / 2; ground.position.y = -0.02; ground.receiveShadow = true; scene.add(ground);
const grid = new THREE.GridHelper(400, 40, '#c2b393', '#cdbf9f'); grid.position.set(61, 0.001, -44); grid.material.transparent = true; grid.material.opacity = 0.35; scene.add(grid);

// ---- object registry ----
const OBJ = new Map(); const pickables = [];
const ZONES = {};
function reg(o, parts) {
  o.parts = parts; o.disc = o.disc || 'spatial';
  parts.forEach(m => { m.userData.id = o.id; m.userData.layer = m.userData.layer || o.layer; m.castShadow = m.userData.layer !== 'trench' && m.userData.layer !== 'fence';
    m.receiveShadow = true; m.userData.base = m.material; pickables.push(m); scene.add(m); });
  const bb = new THREE.Box3(); parts.forEach(p => bb.expandByObject(p)); o.bb = bb;
  const c = bb.getCenter(new THREE.Vector3()); o.cx = c.x; o.cy = -c.z;
  o.dims = { L: bb.max.x - bb.min.x, W: bb.max.z - bb.min.z, H: bb.max.y - bb.min.y, top: bb.max.y, bot: bb.min.y };
  if (o.label) { const d = document.createElement('div'); d.className = 'lbl'; d.textContent = o.label; const lo = new CSS2DObject(d);
    lo.position.set(c.x, bb.max.y + 2, c.z); scene.add(lo); o.lblObj = lo; }
  OBJ.set(o.id, o); return o;
}
function box(x0, y0, x1, y1, z0, h, mat, layer) {
  const m = new THREE.Mesh(new THREE.BoxGeometry(x1 - x0, h, y1 - y0), mat);
  m.position.copy(L((x0 + x1) / 2, (y0 + y1) / 2, z0 + h / 2)); if (layer) m.userData.layer = layer; return m;
}
function cyl(x, y, z0, h, r, mat, layer, r2) {
  const m = new THREE.Mesh(new THREE.CylinderGeometry(r, r2 ?? r, h, 16), mat); m.position.copy(L(x, y, z0 + h / 2)); if (layer) m.userData.layer = layer; return m;
}
function tube(pts, r, mat, layer) {
  const path = new THREE.CurvePath(); for (let i = 1; i < pts.length; i++) path.add(new THREE.LineCurve3(L(...pts[i - 1]), L(...pts[i])));
  const m = new THREE.Mesh(new THREE.TubeGeometry(path, pts.length * 8, r, 8, false), mat); if (layer) m.userData.layer = layer; return m;
}
const plen = pts => pts.reduce((s, p, i) => i ? s + Math.hypot(p[0] - pts[i - 1][0], p[1] - pts[i - 1][1], p[2] - pts[i - 1][2]) : 0, 0);

// ---- shared reference text ----
const SRC = {
  e301: { t: 'E-301 Equipment Layout (60%)', f: 'Comstock 60% Electrical Drawings - 061826.pdf', p: 5 },
  e200: { t: 'E-200 One-Line (60%)', f: 'Comstock 60% Electrical Drawings - 061826.pdf', p: 2 },
  e302: { t: 'E-302 Grounding Plan', f: 'Comstock 60% Electrical Drawings - 061826.pdf', p: 6 },
  e400: { t: 'E-400 Riser Pole P6', f: 'Comstock 60% Electrical Drawings - 061826.pdf', p: 8 },
  e401: { t: 'E-401 Recloser Pole P5', f: 'Comstock 60% Electrical Drawings - 061826.pdf', p: 9 },
  e403: { t: 'E-403 Conduit & Cable Schedule', f: 'Comstock 60% BOM.xlsx', p: 0 },
  e404: { t: 'E-404 Aux Service Rack', f: 'Comstock 60% Electrical Drawings - 061826.pdf', p: 12 },
  ga: { t: 'PNA sh.03 General Assembly + survey', f: 'FORTIFY GRID 2026-10-09 WITH POLE DETAIL.pdf', p: 3 },
  pad: { t: 'PNA sh.04–06 Pad-mount pad & piers', f: 'FORTIFY GRID 2026-10-09 WITH POLE DETAIL.pdf', p: 4 },
  str: { t: 'Structural IFC Rev 1', f: 'Constock Structural Drawings IFC Rev 1 12.05.2025.pdf', p: 2 },
  fdn: { t: 'Foundation Plan S1-0', f: 'Comstock Foundation Plans S1-0 05072026.pdf', p: 1 },
  fence: { t: 'Axial sh.07–08 Fencing details', f: 'IFC PHYSICAL PACKAGE VV.5 Comstock  - 8MW-20MWh BESS As-Built.pdf', p: 5 },
  plot: { t: 'Axial E100 Plot Plan', f: 'IFC PHYSICAL PACKAGE VV.5 Comstock  - 8MW-20MWh BESS As-Built.pdf', p: 1 }
};

/* ============================================================ CIVIL ============================================================ */
const FX = 122.667, FY = 87.458, YARD_T = 0.5, PAD_TOP = 0.5;
reg({ id: 'YARD', name: 'Crushed-rock yard surfacing', type: 'Civil · surfacing', layer: 'yard', disc: 'civil', zone: 'perimeter',
  props: { Area: `${r1(FX * FY)} sf (${(FX * FY / 43560).toFixed(3)} ac)`, Thickness: '6 in (assumed — confirm civil)', Material: 'Crushed rock / aggregate base' },
  calc: o => [{ code: 'CIV-01', desc: 'Crushed-rock yard surfacing, 6 in', qty: Math.ceil(FX * FY * YARD_T / 27), unit: 'CY', by: 'Civil contractor', inst: 'Civil contractor' }],
  scope: [['CC', 'Clear, grub, proof-roll and place 6 in compacted crushed-rock yard surfacing inside fence']],
  src: ['ga'], dwgs: ['C-101', 'C-500'] }, [box(0, 0, FX, FY, -0.45, YARD_T, MAT.gravel)]);

// fence: 8 ft chain link w/ barbed wire, vehicle gate 24'-1.5" + man gate 4' on north side (GA)
(() => {
  const parts = [], posts = [];
  const runs = [[[0, 0], [FX, 0]], [[FX, 0], [FX, FY]], [[FX, FY], [101.125, FY]], [[73, FY], [0, FY]], [[0, FY], [0, 0]]];
  let lf = 0;
  runs.forEach(([a, b]) => { const len = Math.hypot(b[0] - a[0], b[1] - a[1]); lf += len; const n = Math.ceil(len / 10);
    for (let i = 0; i <= n; i++) { const t = i / n; posts.push([a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t]); }
    const mid = [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2], ang = Math.atan2(b[1] - a[1], b[0] - a[0]);
    const fab = new THREE.Mesh(new THREE.PlaneGeometry(len, 7), MAT.fence); fab.position.copy(L(mid[0], mid[1], 3.6)); fab.rotation.y = ang; fab.userData.layer = 'fence'; parts.push(fab);
    parts.push(tube([[a[0], a[1], 7.1], [b[0], b[1], 7.1]], 0.08, MAT.steel, 'fence'));

}

  if (areaStart) { const t = -ray.ray.origin.y / ray.ray.direction.y, g = ray.ray.origin.clone().add(ray.ray.direction.clone().multiplyScalar(t)); drawRect([...areaStart, g.x, -g.z]); }
});
renderer.domElement.addEventListener('pointerup', ev => {
  const moved = downAt && Math.hypot(ev.clientX - downAt[0], ev.clientY - downAt[1]) > 4;
  if (areaStart) { const t = -ray.ray.origin.y / ray.ray.direction.y, g = ray.ray.origin.clone().add(ray.ray.direction.clone().multiplyScalar(t));
    if (moved) selectRect([...areaStart, g.x, -g.z], ev.shiftKey); areaStart = null; controls.enabled = true; return; }
  if (!moved && TOOL === 'measure' && ev.button === 0) { const h = hit(ev); if (h) measureClick(h.p); }
  if (!moved && TOOL === 'area' && ev.button === 0) { const h = hit(ev); if (h?.obj) { SEL.has(h.obj.id) ? SEL.delete(h.obj.id) : SEL.add(h.obj.id); refreshHighlights(); buildAreas(); showTab('areas'); } }
});
renderer.domElement.addEventListener('dblclick', ev => { const h = hit(ev); if (h?.obj) showDetails(h.obj.id); });

function bomRows() {
  const map = new Map();
  [...SEL].map(id => OBJ.get(id)).forEach(o => (o.calc ? o.calc(o) : []).forEach(b => { const k = b.code + '|' + b.desc + '|' + b.unit;
    const r = map.get(k) || { ...b, qty: 0, refs: [] }; r.qty += b.qty; r.refs.push(o.id); map.set(k, r); }));
  return [...map.values()].sort((a, b) => a.code.localeCompare(b.code)).map(r => ({ ...r, qty: Math.round(r.qty * 10) / 10 }));
}
const areaName = () => { const z = Object.values(ZONES).find(z => { const [a, c, b, d] = z.r; const [sa, sc, sb, sd] = [areaMesh.position.x - areaMesh.scale.x / 2, -areaMesh.position.z - areaMesh.scale.y / 2, areaMesh.position.x + areaMesh.scale.x / 2, -areaMesh.position.z + areaMesh.scale.y / 2];
  return Math.abs(a - sa) < 0.5 && Math.abs(b - sb) < 0.5 && Math.abs(c - sc) < 0.5 && Math.abs(d - sd) < 0.5; }); return z ? z.name : `Custom selection (${SEL.size} objects)`; };

function savePrefs() { try { localStorage.setItem('cms-viewer-prefs', JSON.stringify(PREF)); } catch { /* storage blocked: settings last for this visit only */ } }
let DL = null;
if (!LOCAL && window.claude?.use) window.claude.use('downloads').then(d => { DL = d; }, () => {});
const canSave = () => LOCAL || !!DL;
async function saveFile(name, text, mime, btn) {
  if (LOCAL) return download(name, text, mime);
  if (!DL) return copyText(text, btn);
  try { await DL.save({ filename: name, data: text }); btn.textContent = 'Saved'; }
  catch (e) { if (e?.code === 'declined') return; if (e?.code === 'rate_limited') { btn.textContent = 'Try again in a moment'; return; } copyText(text, btn); }
}
function copyText(text, btn) {
  const done = () => { btn.textContent = 'Copied'; setTimeout(() => btn.textContent = btn.dataset.label, 1500); };
  btn.dataset.label = btn.dataset.label || btn.textContent;
  const fallback = () => { const ta = document.createElement('textarea'); ta.value = text; ta.style.cssText = 'width:100%;height:160px;margin-bottom:8px;font:12px var(--f-mono)';
    document.getElementById('mBody').prepend(ta); ta.select(); btn.textContent = 'Press Ctrl/Cmd + C'; };
  try { navigator.clipboard.writeText(text).then(done, fallback); } catch { fallback(); }
}
function reqHTML() {
  const cnt = (d, s) => MDL.filter(m => m.d === d && m.st === s).length;
  return `<div class="req" id="reqDoc">

   <tr><td><b>Shows</b></td><td>Fence, gates, 4 BESS, 2 PCS/MVT skids, aux rack, T1, poles P1–P6, light pole</td><td>Equipment, 12.47 kV OH line, MV / DC / LV / comms cables by colour, ground grid</td><td>Foundations (new vs existing), T1 pad and piers, trenches, yard, fence, road</td></tr>

   <li><b>Inspect:</b> double-click any object for its dimensions, location, ratings, connections, BOM lines, drawing status and source sheet.</li>
   <li><b>Select an area:</b> pick a preset (BESS block, PCS skids, aux service, pole line, whole plant) or drag a box in plan view.</li>
   <li><b>BOM:</b> the selected area's quantities, grouped by item code, with who furnishes and who installs each item.</li>
   <li><b>Work statement:</b> the selected area's scope, split by contractor (Civil, Electrical, Owner, AEP), with the drawings it relies on.</li>
   <li><b>Drawing list (MDL):</b> each deliverable shows issued, partial or missing. Click one to highlight what it covers in 3D.</li>
  </ol>
  <h4>3. Coordinates and units</h4>

  <p>Now: three.js r160 (scene, OrbitControls, CSS2D labels). Next phase: That Open Engine + web-ifc (IFC models), dxf-viewer (CAD overlay), turf.js (polygon areas), React Flow (single-line diagram linked to 3D).</p>

   <li><b>Pole positions disagree</b> between E-301 and PNA sh.03 (Oct-26 IFC). The viewer uses PNA sh.03, which is surveyed.</li>
   <li><b>Confirm these assumed values:</b> foundation thickness 18 in and top of concrete +6 in; yard rock 6 in; fence 7 ft + 1 ft barbed; ground grid depth 30 in and its layout; light-pole location; trench routes.</li>
   <li><b>Survey the equipment corners</b> (BESS, skids, rack) so the whole model is survey-controlled.</li>
   <li><b>Issue the missing drawings</b> listed in §5 as the next engineering package.</li>
  </ol></div>`;
}

  <h4>Baseline configuration</h4><ul><li>4 × Gotion ESD1331-05P5015 (5.015 MWh each, 20.06 MWh DC nameplate)</li><li>4 × Dynapower CPS-2500 Gen5 PCS on 2 skids with 2 × TMC 4600 kVA 3-winding MVT (60 % BOM)</li>
   <li>G&amp;W recloser + SEL-651R2 on P5; S&amp;C gang disconnect on P4; AEP metering P3, recloser P2, aux feed P1</li><li>AEP 300 kVA pad-mount T1 → 480 V aux rack (MB, DP, MPC, UPS, EMS, telecom)</li></ul>
  <h4>Assumed values (shown as "assumed" in details)</h4><ul><li>Foundations 18 in thick, top of concrete 6 in above grade</li><li>Crushed-rock yard 6 in</li><li>Fence 7 ft fabric + 1 ft barbed</li>

function settingsHTML() {
  return `<div class="set">
   <label for="sUnits">Units<small>Measurements and the detail panel</small></label><select id="sUnits"><option value="ft"${UNITS === 'ft' ? ' selected' : ''}>Feet-inches</option><option value="m"${UNITS === 'm' ? ' selected' : ''}>Metres</option></select>
   <label for="sLabels">Equipment labels<small>Tags above BESS, PCS, poles</small></label><input type="checkbox" id="sLabels"${labelsOn ? ' checked' : ''}>

   <label for="sView">Opening view<small>Used the next time the page loads</small></label><select id="sView">${['spatial', 'electrical', 'civil'].map(v => `<option value="${v}"${(PREF.view || 'spatial') === v ? ' selected' : ''}>${v[0].toUpperCase() + v.slice(1)}</option>`).join('')}</select>
  </div><p class="meta" style="margin-top:14px">Settings are saved in this browser only.</p>`;

const printDoc = () => `<!doctype html><html lang="en"><head><meta charset="utf-8"><title>Comstock Viewer Requirements</title><style>body{font:13px/1.5 system-ui,sans-serif;color:#111;background:#fff;max-width:780px;margin:24px auto;padding:0 16px}table{border-collapse:collapse;width:100%}td,th{border:1px solid #bbb;padding:4px 6px;text-align:left;vertical-align:top}h4{margin:18px 0 6px}.meta{color:#555}.np{float:right;padding:6px 12px;font:inherit}@media print{.np{display:none}}</style></head><body><button class="np" onclick="print()">Print</button>${reqHTML()}</body></html>`;
function openAdmin(tab = 'req') {
  const tabs = [['req', 'Requirements'], ['basis', 'Model basis'], ['set', 'Settings']];
  const body = tab === 'req' ? reqHTML() : tab === 'basis' ? basisHTML() : settingsHTML();
  const btns = tab !== 'req' ? [] : [
    LOCAL && ['Print requirements', () => { const w = open('', '_blank'); if (!w) return; w.document.write(printDoc()); w.document.close(); w.focus(); w.print(); }],
    !LOCAL && canSave() && ['Download printable (.html)', b => saveFile('Comstock_Viewer_Requirements.html', printDoc(), 'text/html', b)],
    ['Copy text', b => copyText(document.getElementById('reqDoc').innerText, b)]].filter(Boolean);
  modal('Admin', `<div class="seg" style="margin-bottom:14px">${tabs.map(([k, t]) => `<button data-at="${k}" class="${k === tab ? 'on' : ''}">${t}</button>`).join('')}</div>${body}
    ${tab === 'req' && !LOCAL ? '<p class="note">To print, download the printable file, open it, and use its Print button.</p>' : ''}`, btns);
  document.querySelectorAll('[data-at]').forEach(b => b.onclick = () => openAdmin(b.dataset.at));
  if (tab === 'set') {
    document.getElementById('sUnits').onchange = e => { UNITS = PREF.units = e.target.value; savePrefs(); if (DET) showDetails(DET); };
    document.getElementById('sLabels').onchange = e => { labelsOn = PREF.labels = e.target.checked; savePrefs(); applyView(VIEW); };
    document.getElementById('sShadows').onchange = e => { sun.castShadow = PREF.shadows = e.target.checked; savePrefs(); };
    document.getElementById('sView').onchange = e => { PREF.view = e.target.value; savePrefs(); };
  }
}

/* ============================================================ FORTIFYGRID APP (app.fortifygrid.com/ide/) ============================================================ */
// The portal Worker signs the user in and gates /ide/; engineers and admins also get the engine's IFC / Excel files.
if (APP) {
  document.getElementById('backApps').hidden = false;
  fetch('/api/me').then(r => r.ok ? r.json() : null).then(me => {
    const role = me?.apps?.find(a => a.id === 'ide')?.role;
    if (role !== 'engineer' && role !== 'admin') return;
    const el = document.getElementById('appDl'); el.hidden = false; el.className = 'seg';
    el.innerHTML = [['IFC', 'comstock_revA.ifc'], ['Excel', 'comstock_ide_revA.xlsx']].map(([t, f]) =>
      `<a class="btn" style="border:0;border-radius:0" href="files/${f}">${t}</a>`).join('');
  }).catch(() => {});
}

/* ============================================================ UI WIRING ============================================================ */
function showTab(p) { document.querySelectorAll('.tabs button').forEach(b => b.classList.toggle('on', b.dataset.p === p)); document.querySelectorAll('.pane').forEach(e => e.classList.toggle('on', e.id === 'p-' + p)); }
document.querySelectorAll('.tabs button').forEach(b => b.onclick = () => showTab(b.dataset.p));
document.querySelectorAll('#views button').forEach(b => b.onclick = () => applyView(b.dataset.v));
document.querySelectorAll('#tools button').forEach(b => b.onclick = () => setTool(b.dataset.t));
document.querySelectorAll('#cams button').forEach(b => b.onclick = () => cam(b.dataset.c));
document.getElementById('adminBtn').onclick = () => openAdmin('req');

function onResize() { const w = view.clientWidth, h = view.clientHeight; renderer.setSize(w, h); lr.setSize(w, h); camera.aspect = w / h; camera.updateProjectionMatrix(); }
addEventListener('resize', onResize);
new ResizeObserver(onResize).observe(view);
if (PREF.shadows === false) sun.castShadow = false;
onResize(); cam('iso', false); applyView(PREF.view || 'spatial'); buildAreas(); buildMDL(); hint.textContent = toolHint();
renderer.setAnimationLoop(() => { controls.update(); renderer.render(scene, camera); lr.render(scene, camera); });
window.__viewer = { OBJ, SEL, applyView, selectRect, openBOM, openSOW, showDetails };
</script>
