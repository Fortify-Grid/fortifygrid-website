with us to explore innovations in grid analytics, technology integration, and 
deployment strategies.

We also work closely with developers focused on high-performance assets 
that" transform="translate(352.313 8047.958)" fill="#1e1e1e" font-size="23" font-family="RetinaTRIALLight, Retina TRIAL"><tspan x="0" y="0">We invite collaboration and partnerships with best-in-class teams. Connect </tspan><tspan x="0" y="35">with us to explore innovations in grid analytics, technology integration, and </tspan><tspan x="0" y="70">deployment strategies.</tspan><tspan x="0" y="105"></tspan><tspan x="0" y="140">We also work closely with developers focused on high-performance assets </tspan><tspan x="0" y="175">that strengthen the grid-whether it’s small-scale Front of the Meter (FTM) </tspan><tspan x="0" y="210">or Behind the Meter (BTM) storage, mini-grids, hybrid renewables, or other </tspan><tspan x="0" y="245">innovative applications.</tspan><tspan x="0" y="280"></tspan><tspan x="0" y="315">Your expertise is valued. We are committed to building equitable, long-term </tspan><tspan x="0" y="350">business relationships.</tspan></text>
      </g>
